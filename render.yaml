services:
  - type: web
    name: anti-rtrp-backend
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: anti_rtrp
      - key: MONGODB_COLLECTION
        value: chat_history
